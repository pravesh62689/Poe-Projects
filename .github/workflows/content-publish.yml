name: Content Quality Gate & Static Site Deploy

on:
  push:
    paths:
      - 'site/**'
      - 'growth/content/**'
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate Content & Deploy Static Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Briefs & Drafts
        run: node scripts/growth/validate-content.js

      - name: Validate Claims
        run: node scripts/growth/check-claims.js

      - name: Check Duplicate Content
        run: node scripts/growth/check-duplicate-content.js

      - name: Check Internal & External Links
        run: node scripts/growth/check-links.js

      - name: Build & Validate Sitemap
        run: node scripts/growth/build-sitemap.js

      - name: Upload Static Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-dist
          path: site/
