name: Static SEO Site Build & Deploy Gate

on:
  push:
    paths:
      - 'site/**'
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate Site & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Local Site Quality & Link Integrity
        run: |
          node scripts/growth/audit-seo.js
          node scripts/growth/check-links.js
          node scripts/growth/check-accessibility.js
          node scripts/growth/validate-schema.js
          node scripts/growth/check-performance-budget.js
          node scripts/growth/build-sitemap.js

      - name: Check Cloudflare Deployment Credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "DEPLOY_STATE=BLOCKED_MISSING_CREDENTIALS" >> $GITHUB_ENV
            echo "Cloudflare credentials not configured in GitHub repository secrets."
          else
            echo "DEPLOY_STATE=READY_TO_DEPLOY" >> $GITHUB_ENV
          fi

      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY_STATE == 'READY_TO_DEPLOY'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=poe-developer-suite --branch=main

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build-dist
          path: site/
