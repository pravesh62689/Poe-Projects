name: Automated Growth & Conversion Reports

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

jobs:
  generate-reports:
    name: Generate Conversion & Product Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Analytics & Funnel Report
        run: node scripts/growth/create-analytics-report.js

      - name: Track Daily User Activity & Champion Bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/growth/track-daily-activity.js

      - name: Archive Reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-growth-reports
          path: |
            growth/reports/*.md
            growth/reports/*.csv
            growth/analytics/*.json
