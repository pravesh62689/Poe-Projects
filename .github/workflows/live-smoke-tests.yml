name: Controlled Live Smoke Tests

on:
  schedule:
    - cron: '0 12 * * 1' # Weekly on Mondays at 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (health check only)'
        required: false
        default: 'false'

jobs:
  live-gate:
    name: Live Endpoint Health & Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Live Growth Gate Suite
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          POE_ACCESS_KEY: ${{ secrets.POE_ACCESS_KEY }}
        run: node scripts/growth/run-live-growth-gate.js

      - name: Archive Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gate-evidence
          path: |
            qa/live-growth-gate/reports/*.md
            qa/live-growth-gate/manifests/*.json
