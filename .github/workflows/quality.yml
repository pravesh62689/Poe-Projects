name: CI Quality Gate & Security Scan

on:
  push:
    branches: [main, master, "qa/**"]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Unit Tests, Typecheck & Content Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Programmatic Content Quality Gate
        run: node scripts/growth/validate-content.js

      - name: Run Marketing Claims & Truthfulness Gate
        run: node scripts/growth/check-claims.js

      - name: Run Duplicate Content & Doorway Gate
        run: node scripts/growth/check-duplicate-content.js

      - name: Run Broken Link Check
        run: node scripts/growth/check-links.js
