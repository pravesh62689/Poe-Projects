name: Technical SEO & Metadata Audit

on:
  push:
    paths:
      - 'site/**'
      - 'growth/seo/**'
      - 'scripts/growth/**'
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  seo-audit:
    name: Audit Metadata, Canonical URLs & Sitemap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify & Rebuild Sitemap
        run: node scripts/growth/build-sitemap.js

      - name: Run Technical SEO Audit
        run: node scripts/growth/audit-seo.js

      - name: Run Link Verification
        run: node scripts/growth/check-links.js

      - name: Upload SEO Reports
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-reports
          path: |
            growth/seo/technical-validation-report.md
            growth/reports/technical-seo-report.md
            site/sitemap.xml
