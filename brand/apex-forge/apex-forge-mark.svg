<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="forgeGradientLeft" x1="120" y1="420" x2="256" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="forgeGradientRight" x1="256" y1="90" x2="392" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="sparkGradient" x1="256" y1="180" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded plate for standalone app icon context -->
  <rect width="512" height="512" rx="108" fill="#0b0f17"/>
  <rect x="2" y="2" width="508" height="508" rx="106" stroke="#1e293b" stroke-width="3" fill="none"/>

  <!-- Geometric Forged Apex Mark -->
  <g filter="url(#forgeGlow)">
    <!-- Left Strut (Precision Tech Slate to Ember) -->
    <path d="M256 86 L112 376 L184 394 L256 226 Z" fill="url(#forgeGradientLeft)"/>

    <!-- Right Strut (Forged Copper/Ember Core) -->
    <path d="M256 86 L256 226 L328 394 L400 376 Z" fill="url(#forgeGradientRight)"/>

    <!-- Central Precision Core (Negative / Uplink Chevron) -->
    <path d="M256 256 L196 396 L256 426 L316 396 Z" fill="url(#sparkGradient)"/>

    <!-- Top Apex Keystone Spark -->
    <polygon points="256,64 272,96 256,128 240,96" fill="#ffedd5"/>
  </g>
</svg>
