      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="60%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="cardMarkLeft" x1="120" y1="420" x2="256" y2="90" gradientUnits="userSpaceOnUse">
