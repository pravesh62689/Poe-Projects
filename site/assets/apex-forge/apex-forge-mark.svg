<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d15"/>
      <stop offset="100%" stop-color="#0e1320"/>
    </linearGradient>
    <linearGradient id="leftFacet" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#182333"/>
      <stop offset="50%" stop-color="#24344c"/>
      <stop offset="100%" stop-color="#3b4d68"/>
    </linearGradient>
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="frontFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="apexDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="baseGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Warm ambient base glow -->
  <ellipse cx="256" cy="380" rx="160" ry="80" fill="url(#baseGlow)"/>

  <!-- Left Dark Steel Facet -->
  <polygon points="256,126 116,396 186,418 256,238" fill="url(#leftFacet)"/>

  <!-- Right Vibrant Flame Facet -->
  <polygon points="256,126 256,238 326,418 396,396" fill="url(#rightFacet)"/>

  <!-- Center Lower Diamond Facet -->
  <polygon points="256,238 186,418 256,448 326,418" fill="url(#frontFacet)" filter="url(#softGlow)"/>

  <!-- Top Radiant Diamond Apex -->
  <polygon points="256,66 272,96 256,126 240,96" fill="url(#apexDiamond)"/>
</svg>
